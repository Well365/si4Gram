<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-size:14px;fill:#0f172a}
      .s{font-size:12px;fill:#475569}
      .h{font-size:18px;font-weight:600;fill:#0f172a}
      .b{font-size:14px;font-weight:600;fill:#0f172a}
      .ln{stroke:#475569;stroke-width:1.6;fill:none}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#ffffff"/>

  <!-- Panel 1: runtime -->
  <text x="24" y="36" class="h">1 · Runtime: encrypt before sending, decrypt before rendering</text>

  <rect x="24" y="56" width="300" height="330" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="40" y="82" class="b">User devices (keys never leave)</text>
  <g>
    <rect x="40" y="96" width="268" height="40" rx="8" fill="#fff" stroke="#93c5fd"/><text x="52" y="121" class="t">Web · telegram-tt fork</text>
    <rect x="40" y="142" width="268" height="40" rx="8" fill="#fff" stroke="#93c5fd"/><text x="52" y="167" class="t">iOS · Si4Gram · Telegram-iOS fork</text>
    <rect x="40" y="188" width="268" height="40" rx="8" fill="#fff" stroke="#93c5fd"/><text x="52" y="213" class="t">macOS · TelegramSwift fork</text>
    <rect x="40" y="234" width="268" height="40" rx="8" fill="#fff" stroke="#93c5fd"/><text x="52" y="259" class="t">Android · DrKLO/Telegram fork</text>
    <rect x="40" y="280" width="268" height="40" rx="8" fill="#fff" stroke="#93c5fd"/><text x="52" y="305" class="t">Desktop · tdesktop fork</text>
    <rect x="40" y="326" width="268" height="40" rx="8" fill="#fff" stroke="#93c5fd"/><text x="52" y="351" class="t">Mini App + Bot (official client)</text>
  </g>

  <rect x="372" y="56" width="300" height="330" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="388" y="82" class="b">Plug-in layer in every client</text>
  <rect x="388" y="100" width="268" height="52" rx="8" fill="#fff" stroke="#6ee7b7"/><text x="400" y="122" class="t">Send hook → encrypt</text><text x="400" y="141" class="s">only at the text-send entry</text>
  <rect x="388" y="162" width="268" height="52" rx="8" fill="#fff" stroke="#6ee7b7"/><text x="400" y="184" class="t">Render hook → decrypt</text><text x="400" y="203" class="s">undecryptable: keep as-is + lock badge</text>
  <rect x="388" y="224" width="268" height="52" rx="8" fill="#fff" stroke="#6ee7b7"/><text x="400" y="246" class="t">Local keyring</text><text x="400" y="265" class="s">Keychain / Keystore / DPAPI / IndexedDB</text>
  <rect x="388" y="286" width="268" height="52" rx="8" fill="#fff" stroke="#6ee7b7"/><text x="400" y="308" class="t">libsodium only</text><text x="400" y="327" class="s">XChaCha20-Poly1305 · X25519 · Ed25519</text>
  <text x="388" y="368" class="s">code marked // SECUTG-HOOK in upstream files</text>

  <path d="M324 221 L372 221" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect x="740" y="80" width="430" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="760" y="110" class="b">Telegram servers</text>
  <text x="760" y="132" class="t">MTProto unchanged</text>
  <text x="760" y="154" class="s">see only E1 / E2 / P2 / G2 ciphertext and signed control lines</text>
  <path d="M672 150 L740 126" class="ln" marker-end="url(#a)"/>

  <rect x="740" y="190" width="430" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="760" y="218" class="b">Relay (optional)</text>
  <text x="760" y="240" class="t">short-lived encrypted blobs, read-count / expiry</text>
  <text x="760" y="259" class="s">Cloudflare Workers · AWS · Google Cloud · self-hosted Node</text>
  <path d="M672 236 L740 230" class="ln dash" marker-end="url(#a)"/>

  <rect x="740" y="288" width="430" height="98" rx="12" fill="#fefce8" stroke="#fcd34d"/>
  <text x="760" y="314" class="b">Single sources of truth</text>
  <text x="760" y="336" class="t">PLAN.md protocol spec · shared string table + generator</text>
  <text x="760" y="358" class="t">shared test vectors · 5×5 cross-client matrix (xcheck)</text>
  <text x="760" y="377" class="s">every client must encrypt and decrypt every other client</text>
  <path d="M740 337 L672 318" class="ln dash" marker-end="url(#a)"/>

  <!-- Panel 2: agents -->
  <line x1="24" y1="414" x2="1176" y2="414" stroke="#e2e8f0" stroke-width="2"/>
  <text x="24" y="448" class="h">2 · How the prompts drive the AI agents</text>

  <rect x="24" y="470" width="150" height="56" rx="28" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="99" y="503" class="b" text-anchor="middle">Human owner</text>

  <rect x="214" y="470" width="190" height="56" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="309" y="494" class="b" text-anchor="middle">Claude Code session</text>
  <text x="309" y="513" class="s" text-anchor="middle">kickoff / phase prompt</text>
  <path d="M174 498 L214 498" class="ln" marker-end="url(#a)"/>

  <rect x="444" y="462" width="230" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="456" y="484" class="t">Constitution · CLAUDE.md</text>
  <rect x="444" y="502" width="230" height="34" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="456" y="524" class="t">Hard constraints (no push/delete)</text>
  <path d="M404 490 L444 479" class="ln" marker-end="url(#a)"/>
  <path d="M404 506 L444 519" class="ln" marker-end="url(#a)"/>

  <rect x="714" y="470" width="270" height="56" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="849" y="494" class="b" text-anchor="middle">preflight → execute →</text>
  <text x="849" y="513" class="b" text-anchor="middle">verify → record</text>
  <path d="M674 498 L714 498" class="ln" marker-end="url(#a)"/>

  <rect x="1020" y="462" width="156" height="34" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="1032" y="484" class="t">PASS: local commit</text>
  <rect x="1020" y="502" width="156" height="34" rx="8" fill="#fff" stroke="#fca5a5"/>
  <text x="1032" y="524" class="t">FAIL: stop, report</text>
  <path d="M984 490 L1020 479" class="ln" marker-end="url(#a)"/>
  <path d="M984 506 L1020 519" class="ln" marker-end="url(#a)"/>
  <path d="M1098 536 L1098 552 L99 552 L99 526" class="ln dash" marker-end="url(#a)"/>

  <rect x="24" y="580" width="1152" height="220" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="606" class="b">macOS assistant (SmartMate): drafts, never acts alone</text>

  <rect x="40" y="626" width="170" height="56" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="125" y="650" class="t" text-anchor="middle">macOS client</text>
  <text x="125" y="669" class="s" text-anchor="middle">only key holder</text>

  <rect x="260" y="626" width="170" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="345" y="650" class="t" text-anchor="middle">secutg-mate</text>
  <text x="345" y="669" class="s" text-anchor="middle">inbox · rules · tasks</text>
  <path d="M210 654 L260 654" class="ln" marker-end="url(#a)"/>
  <text x="235" y="645" class="s" text-anchor="middle">socket</text>

  <rect x="480" y="626" width="200" height="56" rx="8" fill="#fff" stroke="#6ee7b7"/>
  <text x="580" y="650" class="t" text-anchor="middle">/secutg-task</text>
  <text x="580" y="669" class="s" text-anchor="middle">forked read-only analyst</text>
  <path d="M430 654 L480 654" class="ln" marker-end="url(#a)"/>

  <rect x="730" y="626" width="130" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="795" y="659" class="t" text-anchor="middle">result.md draft</text>
  <path d="M680 654 L730 654" class="ln" marker-end="url(#a)"/>

  <rect x="910" y="616" width="250" height="40" rx="8" fill="#fff" stroke="#f9a8d4"/>
  <text x="922" y="641" class="t">/secutg-review · human says “send”</text>
  <rect x="910" y="664" width="250" height="40" rx="8" fill="#fff" stroke="#f9a8d4"/>
  <text x="922" y="689" class="t">/secutg-apply · isolated worktree</text>
  <rect x="910" y="712" width="250" height="40" rx="8" fill="#fff" stroke="#f9a8d4"/>
  <text x="922" y="737" class="t">/secutg-jira · local Chrome</text>
  <path d="M860 648 L910 636" class="ln" marker-end="url(#a)"/>
  <path d="M860 660 L910 684" class="ln" marker-end="url(#a)"/>
  <path d="M860 672 L910 730" class="ln" marker-end="url(#a)"/>
  <text x="1160" y="778" class="s" text-anchor="end">each outward action needs explicit human approval</text>

  <rect x="480" y="716" width="380" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="670" y="740" class="t" text-anchor="middle">PreToolUse guard hook + permission deny lists</text>
  <text x="670" y="759" class="s" text-anchor="middle">untrusted text is data, never instructions</text>
  <path d="M580 716 L580 682" class="ln dash" marker-end="url(#a)"/>
</svg>
